  <title id="api-server-title">TechInsights API request path</title>
  <desc id="api-server-desc">Architecture of the API request path: the Vercel BFF calls Cloudflare and nginx, requests pass the Spring Security chain into controllers, domain services, repositories and PostgreSQL, with a cached, fail-fast Gemini embedding side path.</desc>
