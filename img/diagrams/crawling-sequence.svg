anchor="middle" letter-spacing="0.04em">RSS / Atom XML</text><rect x="539" y="780" width="286" height="20" rx="2" fill="#f5f5f5"/><text x="682" y="794" fill="#7a8399" font-size="12" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.04em">INSERT … ON CONFLICT (url) DO NOTHING</text><rect x="1348" y="824" width="116" height="20" rx="2" fill="#f5f5f5"/><text x="1406" y="838" fill="#7a8399" font-size="12" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.04em">inserted count</text><rect x="80" y="40" width="240" height="80" rx="6" fill="#f5f5f5"/><rect x="80" y="40" width="240" height="80" rx="6" fill="#2d3142" fill-opacity="0.03" stroke="#2d3142" stroke-opacity="0.40" stroke-width="1"/><text x="92" y="68" fill="#2d3142" font-size="16" font-weight="600" font-family="'Geist', 'Noto Sans KR', sans-serif">GitHub Actions</text><text x="92" y="92" fill="#4f5d75" font-size="12" font-family="'Geist Mono', ui-monospace, monospace">cron → SSM runner</text><text x="92" y="108" fill="#4f5d75" font-size="12" font-family="'Geist Mono', ui-monospace, monospace">--spring.batch.job.name</text><rect x="400" y="40" width="240" height="80" rx="6" fill="#f5f5f5"/><rect x="400" y="40" width="240" height="80" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/><text x="412" y="68" fill="#2d3142" font-size="16" font-weight="600" font-family="'Geist', 'Noto Sans KR', sans-serif">crawlPostJob step</text><text x="412" y="92" fill="#4f5d75" font-size="12" font-family="'Geist Mono', ui-monospace, monospace">CompanyReader</text><text x="412" y="108" fill="#4f5d75" font-size="12" font-family="'Geist Mono', ui-monospace, monospace">RawPostProcessor / Writer</text><rect x="720" y="40" width="240" height="80" rx="6" fill="#f5f5f5"/><rect x="720" y="40" width="240" height="80" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/><text x="732" y="68" fill="#2d3142" font-size="16" font-weight="600" font-family="'Geist', 'Noto Sans KR', sans-serif">Guards</text><text x="732" y="92" fill="#4f5d75" font-size="12" font-family="'Geist Mono', ui-monospace, monospace">UrlValidator</text><text x="732" y="108" fill="#4f5d75" font-size="12" font-family="'Geist Mono', ui-monospace, monospace">DomainRateLimiterManager</text><rect x="1040" y="40" width="240" height="80" rx="6" fill="#f5f5f5"/><rect x="1040" y="40" width="240" height="80" rx="6" fill="#2d3142" fill-opacity="0.03" stroke="#2d3142" stroke-opacity="0.40" stroke-width="1"/><text x="1052" y="68" fill="#2d3142" font-size="16" font-weight="600" font-family="'Geist', 'Noto Sans KR', sans-serif">Blog feed</text><text x="1052" y="92" fill="#4f5d75" font-size="12" font-family="'Geist Mono', ui-monospace, monospace">company.blog_url</text><text x="1052" y="108" fill="#4f5d75" font-size="12" font-family="'Geist Mono', ui-monospace, monospace">external host</text><rect x="1360" y="40" width="240" height="80" rx="6" fill="#f5f5f5"/><rect x="1360" y="40" width="240" height="80" rx="6" fill="#2d3142" fill-opacity="0.05" stroke="#4f5d75" stroke-width="1"/><text x="1372" y="68" fill="#2d3142" font-size="16" font-weight="600" font-family="'Geist', 'Noto Sans KR', sans-serif">PostgreSQL</text><text x="1372" y="92" fill="#4f5d75" font-size="12" font-family="'Geist Mono', ui-monospace, monospace">company · posts</text><text x="1372" y="108" fill="#4f5d75" font-size="12" font-family="'Geist Mono', ui-monospace, monospace">uq_posts_url</text><rect x="48" y="920" width="1552" height="56" rx="6" fill="#f5f5f5"/><rect x="48" y="920" width="1552" height="56" rx="6" fill="#2d3142" fill-opacity="0.02" stroke="#2d3142" stroke-opacity="0.30" stroke-width="1"/><text x="60" y="943" fill="#2d3142" font-size="12" font-family="'Geist Mono', ui-monospace, monospace">Later, separate runs: optimizedSummaryJob (07:00 UTC) summarises posts with is_summary = false, then postVectorEmbeddingJob (08:00 UTC)</text><text x="60" y="961" fill="#4f5d75" font-size="12" font-family="'Geist Mono', ui-monospace, monospace">embeds summarised posts into post_embedding.</text><text x="580" y="736" fill="#4f5d75" font-size="12" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">parse entries · fetch content · skip blank · distinct url</text><line x1="40" y1="1032" x2="1608" y2="1032" stroke="#2d3142" stroke-opacity="0.10" stroke-width="0.8"/><text x="40" y="1056" fill="#4f5d75" font-size="12" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start" letter-spacing="0.14em">LEGEND</text><rect x="140" y="1044" width="24" height="16" rx="4" fill="#ffffff" stroke="#2d3142" stroke-width="1"/><text x="172" y="1056" fill="#4f5d75" font-size="12" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">Component</text><rect x="270" y="1044" width="24" height="16" rx="4" fill="#2d3142" fill-opacity="0.03" stroke="#2d3142" stroke-opacity="0.40" stroke-width="1"/><text x="302" y="1056" fill="#4f5d75" font-size="12" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">External</text><rect x="393" y="1044" width="24" height="16" rx="4" fill="#2d3142" fill-opacity="0.05" stroke="#4f5d75" stroke-width="1"/><text x="425" y="1056" fill="#4f5d75" font-size="12" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">Store</text><line x1="494" y1="1052" x2="526" y2="1052" stroke="#4f5d75" stroke-width="1.2"/><text x="534" y="1056" fill="#4f5d75" font-size="12" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">Call</text><line x1="595" y1="1052" x2="627" y2="1052" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="5,4"/><text x="635" y="1056" fill="#4f5d75" font-size="12" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">Return</text></svg>