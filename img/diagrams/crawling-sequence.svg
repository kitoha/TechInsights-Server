  <title id="crawling-sequence-title">One crawlPostJob run</title>
  <desc id="crawling-sequence-desc">Sequence of one crawling run: the scheduled workflow starts crawlPostJob, each company&#x27;s feed URL passes the SSRF guard and a per-domain rate limiter before the feed is fetched and parsed, and new posts are inserted with ON CONFLICT (url) DO NOTHING.</desc>
