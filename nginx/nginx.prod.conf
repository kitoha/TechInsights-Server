limit_req_zone $binary_remote_addr zone=auth:10m rate=10r/m;

server {
    listen 80;
    server_name api.techinsights.shop;
    return 301 https://$host$request_uri;
}

upstream techinsights_api_backend {
    server tech-insights-api:8080 max_fails=1 fail_timeout=10s;
}

server {
    listen 443 ssl http2;
    server_name api.techinsights.shop;

    ssl_certificate     /etc/ssl/cloudflare/api.pem;
    ssl_certificate_key /etc/ssl/cloudflare/api.key;

    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # Cloudflare 뒤에서만 CF-Connecting-IP를 신뢰해 $remote_addr를 실제 클라이언트 IP로 치환
    include /etc/nginx/cloudflare-ips.conf;

    location ~ ^/api/v1/auth/(refresh|logout)$ {
        limit_req zone=auth burst=5 nodelay;
        limit_req_status 429;

        proxy_pass http://techinsights_api_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
    }

    location / {
        proxy_pass http://techinsights_api_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;

        # Docker 다운 시 에러를 intercept
        proxy_intercept_errors on;
        error_page 502 503 504 =503 @maintenance;
    }

    location @maintenance {
        default_type "application/problem+json; charset=utf-8";
        add_header Access-Control-Allow-Origin * always;  # CORS 처리
        return 503 '{"type":"about:blank","title":"Service Unavailable","status":503,"detail":"서버 점검 중입니다. 잠시 후 다시 시도해주세요.","code":"SERVICE_UNAVAILABLE"}';
    }
}
