events {
    worker_connections 1024;
}

http {
    limit_req_zone $binary_remote_addr zone=auth:10m rate=10r/m;

    upstream techinsights_api_backend {
        server api-local:8080 max_fails=1 fail_timeout=10s;
    }

    server {
        listen 80;
        server_name localhost;

        location ~ ^/api/v1/auth/(refresh|logout)$ {
            limit_req zone=auth burst=5 nodelay;
            limit_req_status 429;
            error_page 429 @too_many_requests;

            proxy_pass http://techinsights_api_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location / {
            proxy_pass http://techinsights_api_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Only nginx-detected upstream failure (502/504) becomes the maintenance body;
            # a 503 produced by the app itself (ProblemDetail, e.g. circuit open) passes through unchanged
            proxy_intercept_errors on;
            error_page 502 504 =503 @maintenance;
        }

        location @maintenance {
            default_type "application/problem+json; charset=utf-8";
            add_header Access-Control-Allow-Origin * always;
            return 503 '{"type":"about:blank","title":"Service Unavailable","status":503,"detail":"서버 점검 중입니다. 잠시 후 다시 시도해주세요.","code":"SERVICE_UNAVAILABLE"}';
        }

        location @too_many_requests {
            default_type "application/problem+json; charset=utf-8";
            add_header Access-Control-Allow-Origin * always;
            return 429 '{"type":"about:blank","title":"Too Many Requests","status":429,"detail":"요청이 너무 많습니다. 잠시 후 다시 시도해주세요.","code":"TOO_MANY_REQUESTS"}';
        }
    }
}
